name: EMD TypeScript Safety Check

on:
  push:
    branches:
      - codex/emd-loading-premium
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    name: Check TypeScript (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check types independently of Netlify build
        run: npx tsc --noEmit --incremental false
