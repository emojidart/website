apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    namespace "com.emojisdartverein.app"

    // ✅ passt zu androidx.core 1.15.x
    compileSdk 35

    defaultConfig {
        applicationId "com.emojisdartverein.app"

        // ✅ Fix: @capacitor/push-notifications braucht minSdk 24
        minSdk 24

        // ✅ targetSdk kann bleiben wie du willst (Runtime-Verhalten)
        targetSdk 35

        versionCode 3
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // ✅ AGP 8.x -> Java 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.0.0')
    implementation 'com.google.firebase:firebase-messaging'

    // AndroidX (Capacitor)
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.core:core-splashscreen:1.0.1"

    // ✅ Pin/Constraints damit NICHT activity 1.11 / core 1.17 reinkommt
    constraints {
        implementation("androidx.activity:activity:1.10.1")
        implementation("androidx.activity:activity-ktx:1.10.1")
        implementation("androidx.core:core:1.15.0")
        implementation("androidx.core:core-ktx:1.15.0")
    }

    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}

apply from: 'capacitor.build.gradle'
